<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        ['bank_adminSettings', 'bank_adminSettings_backup', 'geb_admin_settings_v3'].forEach(function(k) {
          var s = localStorage.getItem(k);
          if (s && (s.indexOf('ibb.co') !== -1 || s.indexOf('GEB') !== -1 || s.indexOf('vBZjpPr4') !== -1 || s.indexOf('Elite-Digital-Gold-Globe-Logo') === -1)) {
            var p = JSON.parse(s);
            p.logoUrl = 'https://i.postimg.cc/zXswZC0Y/Elite-Digital-Gold-Globe-Logo.png';
            p.websiteLogo = 'https://i.postimg.cc/zXswZC0Y/Elite-Digital-Gold-Globe-Logo.png';
            p.faviconUrl = 'https://i.postimg.cc/zXswZC0Y/Elite-Digital-Gold-Globe-Logo.png';
            localStorage.setItem(k, JSON.stringify(p));
          }
        });
      } catch(e) {}
      // Defensive accessor shim to prevent "Cannot set property fetch of #<Window> which has only a getter"
      (function() {
        try {
          var _currentFetch = window.fetch ? window.fetch.bind(window) : null;
          var defineFetchAccessor = function(target) {
            if (!target) return;
            try {
              Object.defineProperty(target, 'fetch', {
                get: function() {
                  return _currentFetch || (window.fetch ? window.fetch.bind(window) : undefined);
                },
                set: function(fn) {
                  _currentFetch = typeof fn === 'function' ? fn : _currentFetch;
                },
                configurable: true,
                enumerable: true
              });
            } catch (e) {
              try {
                target.fetch = function() {
                  return (_currentFetch || window.fetch).apply(window, arguments);
                };
              } catch (e2) {}
            }
          };

          defineFetchAccessor(window);
          if (typeof Window !== 'undefined' && Window.prototype) {
            defineFetchAccessor(Window.prototype);
          }
        } catch (globalErr) {}
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>Elite Digital Finance</title>
    <link rel="icon" type="image/png" href="https://i.postimg.cc/zXswZC0Y/Elite-Digital-Gold-Globe-Logo.png" />
    <meta name="description" content="Next-Generation Digital Finance & Private Banking for High-Net-Worth Individuals and Organizations." />
    <meta property="og:title" content="Elite Digital Finance" />
    <meta property="og:description" content="Next-Generation Digital Finance & Private Banking for High-Net-Worth Individuals and Organizations." />
    <meta property="og:type" content="website" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="bg-gradient-to-br from-[#0f172a] via-[#1a0b2e] to-[#2d1b4e] min-h-screen text-foreground antialiased font-poppins">
